server:
  version: "0.0.7"
  project_name: "brainx"
  project_type: "standalone"
  host: "0.0.0.0"
  port: 8000
  max_bytes: 10485760
  cors_origins:
    - "*"
  worker_count: 5
  environment: "local"
  server_render: False
  timezone: "Asia/Shanghai"

jwt:
  jwt_secret: "dev"
  expire_in: 2592000 # 3600*24*30

api:
  api_prefix: "/api"
  openapi_prefix: "/openapi/v1"
  request_timeout: 60

openapi:
  platforms:
    token_secret_key: "xxxxxxxxxxxxxxxxxxxx"
    # 访问BrainX OpenAPI的restful 配置
    power_x:
      access_key: "key_power_x"
      secret_key: "987654321"

  providers:
    # 访问PowerX OpenAPI的restful 配置
    power_x:
      base_url: "http://127.0.0.1:8888/openapi/v1"
      access_key: 'xxxxxxxxxxxx'
      secret_key: 'xxxxxxxxxxxx'

database:
  dsn: "postgresql+asyncpg://user:pass@127.0.0.1:54321/brain_x" # 数据库连接字符串
  db_schema: "public" # 默认的数据库 schema
  pool_size: 4 # 最大连接数
  max_overflow: 4 # 超过池大小的最大连接数
  pool_timeout: 120 # 连接池获取连接的超时时间（秒）
  pool_recycle: 3600 # 连接最大生命周期（秒）
  pool_pre_ping: true # 连接池健康检查
  poolclass:  # "sqlalchemy.pool.NullPool"
  echo: False

cache:
  driver: redis
  redis:
    url: redis://mypassword@localhost:6379/0
    use_jsonb: True

schedule:
  enable: False
  driver: apscheduler
  job_stores:
    default:
      type: sqlalchemy # 或者 redis
      url: postgresql://user:pass@localhost:5432/brain_x
      host: 127.0.0.1
      port: 6379
      db: 0
      username:
      password:
  executors:
    default:
      type: threadpool
      max_workers: 3
  job_defaults:
    coalesce: false
    max_instances: 1

task:
  enable: False
  # celery_broker_url: 'amqp://guest:guest@localhost:5672//'
  # celery_result_backend: 'db+postgresql://username:password@127.0.0.1:5432/brainx'
  celery_broker_url: "redis://localhost:6379/0"
  celery_result_backend: "redis://localhost:6379/0"
  queue:
    default:
    rag_queue: rag_queue
    task_queue: task_queue
  broker_use_ssl: False
  ssl_cert_reqs: ''
  ssl_ca_certs: ''
  ssl_cert_file: ''
  ssl_keyfile: ''
  result_expires: 3600
  broker_connection_retry_on_startup: True
  broker_connection_timeout: 30
  broker_heartbeat: 30
  socket_connect_timeout: 30
  socket_timeout: 30
  task_time_limit: 3600
  task_soft_time_limit: 3000
  worker_concurrency: 2
  worker_prefetch_multiplier: 1
  task_acks_on_failure_or_timeout: True

event:
  enable: False # 默认关闭，如果需要用得到订阅通知事件，可以开启
  driver: rabbitMQ #驱动默认是RabbitMQ
  host: localhost
  port: 5672 # RabbitMQ默认端口
  user: guest
  password: guest
  default_event_queue: queue_brainx #事件队列名称
  queues: []
    # - name: queue_name #事件名
    #   event_name: event_name

models:
  qa_embedding_model_name: "shibing624/text2vec-base-chinese"
  visual_search_model_name: "clip-ViT-L-14"
  visual_query_model_name: "dandelin/vilt-b32-finetuned-vqa"

agent:
  framework_driver: langchain
  vdb: pgvector
  vector_store_table_name: "langchain_pg_embedding"
  vector_store_collection: "rag_embeddings"
  router_llm: gpt-3.5-turbo
  pgvector:
    # 默认使用postgres，和database用的dsn一致，除非你需要自己定义自己另外地址的pgvector地址
    url: "postgresql+psycopg://username:password@127.0.0.1:5432/brain_x"
    use_jsonb: True

log:
  path: logs
  split:
    - error
  level: info
  interval: 1 # 间隔1天（与 "midnight" 配合使用时，interval 设为 1）
  keep_days: 30 # 保留最近n天的日志文件
  console: true # 是否输出到控制台
  stat: false
  exc_info: true
  extra:
    elasticsearch:
      enable: false # 是否使用Elasticsearch
      hosts: 
        - "http://localhost:9200"
      username: "kibana_user"
      password: "your_password"
      index_name: "brain_x_log" # Elasticsearch索引名称

test:
  db_url: 'postgresql+psycopg2://username:password@localhost/test_db'

openai:
  llm_name: "gpt-3.5-turbo"
  api_base: "https://api.openai.com/v1/"
  api_key: "YOUR_API_KEY"
  request_timeout: 30

kimi:
  llm_name: "moonshot-v1-8k"
  api_base: "https://api.moonshot.cn/v1"
  api_key: "sk-reAhVwEXS8KkfazfbgAqDYbOrI9jQtFhCsDtQJA3Gq0Exxxx"
  request_timeout: 30
  
baidu_qianfan:
  api_key: "YOUR_API_KEY"
  secret_key: "YOUR_SECRET_KEY"
  request_timeout: 30

tencent_hunyuan:
  api_base: "https://api.hunyuan.cloud.tencent.com/v1"
  api_key: sk-ADKNWJj4VLqaazEgPDRaIwWHWkY05XFnmdw91rxxxxxx
  request_timeout: 30

ollama:
  url: "http://localhost:11434"

coze:
  api_base: https://api.coze.cn/v1
  api_key: "YOUR_API_KEY"
  
polygon:
  api_key: "YOUR_API_KEY"

sentry:
  dsn: "YOUR_DSN"
  environment: "local"
  release: "1.0"

storage:
  driver: "local"
  host: "127.0.0.1:8000"
  local_storage:
    storage_path: "./storage"
  minio:
    endpoint: "127.0.0.1:9001"
    access_key: "YOUR_ACCESS_KEY"
    secret_key: "YOUR_SECRET_KEY"
    use_ssl: True
    region: 'AsiaShanghai'
  aliyun:
    endpoint: "oss-cn-beijing.aliyuncs.com"
    access_key: "YOUR_ACCESS_KEY"
    secret_key: "YOUR_SECRET_KEY"
    bucket_name: "BUCKET_NAME"
  azure:
    account_name: 'ACCOUNT_NAME'
    account_key: 'ACCOUNT_KEY'
    container_name: 'CONTAINER_NAME'
    bucket_name: 'BUCKET_NAME'
  google:
    bucket_name: 'BUCKET_NAME'
  s3:
    endpoint: 'ENDPOINT'
    access_key: 'ACCESS_KEY'
    secret_key: 'SECRET_KEY'
    bucket_name: 'BUCKET_NAME'
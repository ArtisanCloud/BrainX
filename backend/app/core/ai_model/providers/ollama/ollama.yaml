provider: ollama
title:
  en_US: Ollama
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
background: "#F9FAFB"
help:
  title:
    en_US: How to integrate with Ollama
    zh_CN: 如何集成 Ollama
  url:
    en_US: https://docs.dify.ai/tutorials/model-configuration/ollama
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - customized
models_credential_schema:
  model:
    title:
      en_US: Model Name
      zh_CN: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_CN: 输入模型名称
  credential_form_schemas:
    - variable: base_url
      title:
        zh_CN: 基础 URL
        en_US: Base URL
      type: text-input
      required: true
      placeholder:
        zh_CN: Ollama server 的基础 URL，例如 http://192.168.1.100:11434
        en_US: Base url of Ollama server, e.g. http://192.168.1.100:11434
    - variable: mode
      show_on:
        - variable: __model_type
          value: llm
      title:
        zh_CN: 模型类型
        en_US: Completion mode
      type: select
      required: true
      default: chat
      placeholder:
        zh_CN: 选择对话类型
        en_US: Select completion mode
      options:
        - value: completion
          title:
            en_US: Completion
            zh_CN: 补全
        - value: chat
          title:
            en_US: Chat
            zh_CN: 对话
    - variable: context_size
      title:
        zh_CN: 模型上下文长度
        en_US: Model context size
      required: true
      type: text-input
      default: "4096"
      placeholder:
        zh_CN: 在此输入您的模型上下文长度
        en_US: Enter your Model context size
    - variable: max_tokens
      title:
        zh_CN: 最大 token 上限
        en_US: Upper bound for max tokens
      show_on:
        - variable: __model_type
          value: llm
      default: "4096"
      type: text-input
      required: true
    - variable: vision_support
      title:
        zh_CN: 是否支持 Vision
        en_US: Vision support
      show_on:
        - variable: __model_type
          value: llm
      default: "false"
      type: radio
      required: false
      options:
        - value: "true"
          title:
            en_US: "Yes"
            zh_CN: 是
        - value: "false"
          title:
            en_US: "No"
            zh_CN: 否
    - variable: function_call_support
      title:
        zh_CN: 是否支持函数调用
        en_US: Function call support
      show_on:
        - variable: __model_type
          value: llm
      default: "false"
      type: radio
      required: false
      options:
        - value: "true"
          title:
            en_US: "Yes"
            zh_CN: 是
        - value: "false"
          title:
            en_US: "No"
            zh_CN: 否
